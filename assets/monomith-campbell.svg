<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#2E86AB" />
    </marker>
  </defs>

  <!-- ФОН -->
  <rect width="100%" height="100%" fill="#FAFAFA"/>

  <!-- РАЗДЕЛИТЕЛЬ МИРОВ -->
  <line x1="200" y1="280" x2="700" y2="280" stroke="#C8A66B" stroke-width="2" stroke-dasharray="6,4" opacity="0.7"/>
  
  <!-- Центральные надписи -->
  <g text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="450" y="440" font-size="26" font-weight="bold" fill="#2E86AB" letter-spacing="1">ПУТЬ ГЕРОЯ</text>
    <text x="450" y="470" font-size="15" font-weight="600" fill="#8B6914" letter-spacing="0.5">ОТКРОВЕНИЕ</text>
    
    <text x="450" y="210" font-size="14" font-weight="bold" fill="#C8A66B" letter-spacing="2">ИЗВЕСТНОЕ</text>
    <text x="450" y="720" font-size="14" font-weight="bold" fill="#C8A66B" letter-spacing="2">НЕИЗВЕСТНОЕ</text>
  </g>

  <!-- ТРИ ЧАСТИ ПУТИ (сдвинуты на -40 по X) -->
  <!-- Часть 1: УХОД -->
  <path d="M 425 140 A 280 280 0 0 1 705 420" fill="none" stroke="#D4AF37" stroke-width="4" opacity="0.6" stroke-dasharray="8,4"/>
  
  <!-- Часть 2: ИНИЦИАЦИЯ -->
  <path d="M 705 420 A 280 280 0 0 1 145 420" fill="none" stroke="#2E86AB" stroke-width="4" opacity="0.6"/>
  
  <!-- Часть 3: ВОЗВРАЩЕНИЕ -->
  <path d="M 145 420 A 280 280 0 0 1 425 140" fill="none" stroke="#28A745" stroke-width="4" opacity="0.6" stroke-dasharray="8,4"/>

  <!-- ЭТАПЫ: ЧАСТЬ 1 - УХОД -->
  <g id="departure" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#8B6914">
    <g id="stage-call">
      <circle cx="580" cy="180" r="5" fill="#D4AF37"/>
      <text x="595" y="180" text-anchor="start">Призыв к приключению</text>
      <text x="595" y="195" text-anchor="start" font-size="9" font-weight="normal" font-style="italic" fill="#666">(преквалиа)</text>
    </g>
    
    <g id="stage-refusal">
      <circle cx="690" cy="280" r="5" fill="#D4AF37"/>
      <text x="705" y="280" text-anchor="start">Отказ от призыва</text>
      <text x="705" y="295" text-anchor="start" font-size="9" font-weight="normal" font-style="italic" fill="#666">(детерминанта)</text>
    </g>
    
    <g id="stage-help">
      <circle cx="760" cy="400" r="5" fill="#D4AF37"/>
      <text x="775" y="400" text-anchor="start">Сверхъестественная помощь</text>
      <text x="775" y="415" text-anchor="start" font-size="9" font-weight="normal" font-style="italic" fill="#666">(встреча со Знаком)</text>
    </g>
    
    <g id="stage-threshold">
      <circle cx="780" cy="520" r="5" fill="#D4AF37"/>
      <text x="795" y="520" text-anchor="start">Переход первого порога</text>
      <text x="795" y="535" text-anchor="start" font-size="9" font-weight="normal" font-style="italic" fill="#666">(кенозис)</text>
    </g>
    
    <g id="stage-whale">
      <circle cx="720" cy="630" r="5" fill="#D4AF37"/>
      <text x="735" y="630" text-anchor="start">Чрево кита</text>
      <text x="735" y="645" text-anchor="start" font-size="9" font-weight="normal" font-style="italic" fill="#666">(пребывание в Изнанке)</text>
    </g>
  </g>

  <!-- ЭТАПЫ: ЧАСТЬ 2 - ИНИЦИАЦИЯ -->
  <g id="initiation" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#1E5A7E">
    <g id="stage-trials">
      <circle cx="580" cy="730" r="5" fill="#2E86AB"/>
      <text x="580" y="760" text-anchor="middle">Дорога испытаний</text>
      <text x="580" y="775" text-anchor="middle" font-size="9" font-weight="normal" font-style="italic" fill="#666">(дипластия)</text>
    </g>
    
    <g id="stage-goddess">
      <circle cx="420" cy="780" r="5" fill="#2E86AB"/>
      <text x="420" y="810" text-anchor="middle">Встреча с богиней</text>
      <text x="420" y="825" text-anchor="middle" font-size="9" font-weight="normal" font-style="italic" fill="#666">(диалогическое квалиа)</text>
    </g>
    
    <g id="stage-temptation">
      <circle cx="260" cy="730" r="5" fill="#2E86AB"/>
      <text x="260" y="760" text-anchor="middle">Искушение</text>
      <text x="260" y="775" text-anchor="middle" font-size="9" font-weight="normal" font-style="italic" fill="#666">(ловушка нарциссической маски)</text>
    </g>
    
    <g id="stage-father">
      <circle cx="150" cy="620" r="5" fill="#2E86AB"/>
      <text x="135" y="620" text-anchor="end">Искупление перед отцом</text>
      <text x="135" y="635" text-anchor="end" font-size="9" font-weight="normal" font-style="italic" fill="#666">(высшая дипластия)</text>
    </g>
    
    <g id="stage-apotheosis">
      <circle cx="110" cy="500" r="5" fill="#2E86AB"/>
      <text x="95" y="500" text-anchor="end">Апофеоз</text>
      <text x="95" y="515" text-anchor="end" font-size="9" font-weight="normal" font-style="italic" fill="#666">(гнозис)</text>
    </g>
    
    <g id="stage-gift">
      <circle cx="140" cy="380" r="5" fill="#2E86AB"/>
      <text x="125" y="380" text-anchor="end">Окончательный дар</text>
      <text x="125" y="395" text-anchor="end" font-size="9" font-weight="normal" font-style="italic" fill="#666">(архитектура проводника)</text>
    </g>
  </g>

  <!-- ЭТАПЫ: ЧАСТЬ 3 - ВОЗВРАЩЕНИЕ -->
  <g id="return" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#28A745">
    <g id="stage-refusal-return">
      <circle cx="240" cy="200" r="5" fill="#28A745"/>
      <text x="225" y="200" text-anchor="end">Отказ от возвращения</text>
      <text x="225" y="215" text-anchor="end" font-size="9" font-weight="normal" font-style="italic" fill="#666">(ловушка присвоения)</text>
    </g>
    
    <g id="stage-flight">
      <circle cx="350" cy="140" r="5" fill="#28A745"/>
      <text x="350" y="130" text-anchor="middle">Магический полёт</text>
      <text x="350" y="145" text-anchor="middle" font-size="9" font-weight="normal" font-style="italic" fill="#666">(автопоэтическая рекурсия)</text>
    </g>
    
    <g id="stage-rescue">
      <circle cx="450" cy="115" r="5" fill="#28A745"/>
      <text x="450" y="105" text-anchor="middle">Спасение извне</text>
      <text x="450" y="120" text-anchor="middle" font-size="9" font-weight="normal" font-style="italic" fill="#666">(этический акт Другого)</text>
    </g>
    
    <g id="stage-return-threshold">
      <circle cx="550" cy="140" r="5" fill="#28A745"/>
      <text x="550" y="130" text-anchor="middle">Переход порога возвращения</text>
      <text x="550" y="145" text-anchor="middle" font-size="9" font-weight="normal" font-style="italic" fill="#666">(интеграция без детерминанты)</text>
    </g>
    
    <g id="stage-master">
      <circle cx="320" cy="280" r="5" fill="#28A745"/>
      <text x="305" y="280" text-anchor="end">Мастер двух миров</text>
      <text x="305" y="295" text-anchor="end" font-size="9" font-weight="normal" font-style="italic" fill="#666">(предельная свобода)</text>
    </g>
    
    <g id="stage-freedom">
      <circle cx="580" cy="280" r="5" fill="#28A745"/>
      <text x="595" y="280" text-anchor="start">Свобода жить</text>
      <text x="595" y="295" text-anchor="start" font-size="9" font-weight="normal" font-style="italic" fill="#666">(свобода для)</text>
    </g>
  </g>

  <!-- НАЗВАНИЯ ТРЁХ ЧАСТЕЙ -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold">
    <text x="720" y="340" fill="#D4AF37" text-anchor="middle">ЧАСТЬ 1: УХОД</text>
    <text x="450" y="850" fill="#2E86AB" text-anchor="middle">ЧАСТЬ 2: ИНИЦИАЦИЯ</text>
    <text x="180" y="340" fill="#28A745" text-anchor="middle">ЧАСТЬ 3: ВОЗВРАЩЕНИЕ</text>
  </g>

  <!-- СТРЕЛКИ НАПРАВЛЕНИЯ (сдвинуты на -40 по X) -->
  <g fill="none" stroke="#2E86AB" stroke-width="2" marker-end="url(#arrow)" opacity="0.6">
    <!-- Верхняя правая -->
    <path d="M 495 155 A 280 280 0 0 1 695 315" />
    <!-- Верхняя горизонтальная -->
    <path d="M 315 165 A 280 280 0 0 1 575 165" />
    <!-- Левая верхняя -->
    <path d="M 165 385 A 280 280 0 0 1 215 245" />
    <!-- Правая нижняя -->
    <path d="M 705 405 A 280 280 0 0 1 645 575" />
    <!-- Нижняя горизонтальная -->
    <path d="M 575 645 A 280 280 0 0 1 315 675" />
    <!-- Левая нижняя -->
    <path d="M 215 605 A 280 280 0 0 1 165 445" />
  </g>

</svg>
