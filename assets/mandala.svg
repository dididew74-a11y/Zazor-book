<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFF8DC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F4E4C1;stop-opacity:0.8" />
    </radialGradient>
    <radialGradient id="cycleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#2E86AB;stop-opacity:0.05" />
    </radialGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2E86AB" />
    </marker>
  </defs>
  
  <rect width="1000" height="1000" fill="#FAFAFA"/>
  
  <!-- Внешний круг -->
  <circle cx="500" cy="500" r="400" fill="none" stroke="#C8A66B" stroke-width="3" opacity="0.5"/>
  
  <!-- ДИПЛАСТИЯ (верх) -->
  <g id="diplostia">
    <path d="M 500 100 L 450 200 L 550 200 Z" fill="#C8A66B" opacity="0.7"/>
    <text x="500" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#8B6914">ДИПЛАСТИЯ</text>
    <text x="500" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#8B6914" font-style="italic">камертон</text>
    <line x1="500" y1="200" x2="500" y2="380" stroke="#C8A66B" stroke-width="2" opacity="0.4"/>
  </g>
  
  <!-- ИНТЕРИОРИЗАЦИЯ (право-низ) -->
  <g id="interiorization">
    <path d="M 846 700 L 746 700 L 796 600 Z" fill="#C8A66B" opacity="0.7"/>
    <text x="796" y="655" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#8B6914">ИНТЕР-</text>
    <text x="796" y="673" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#8B6914">ИОРИЗАЦИЯ</text>
    <text x="796" y="690" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#8B6914" font-style="italic">сворачивание</text>
    <line x1="746" y1="650" x2="620" y2="560" stroke="#C8A66B" stroke-width="2" opacity="0.4"/>
  </g>
  
  <!-- РЕКУРСИЯ (лево-низ) -->
  <g id="recursion">
    <path d="M 154 700 L 254 700 L 204 600 Z" fill="#C8A66B" opacity="0.7"/>
    <text x="204" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#8B6914">РЕКУРСИЯ</text>
    <text x="204" y="680" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#8B6914" font-style="italic">спираль</text>
    <line x1="254" y1="650" x2="380" y2="560" stroke="#C8A66B" stroke-width="2" opacity="0.4"/>
  </g>
  
  <!-- Цикл (большой круг) -->
  <circle cx="500" cy="500" r="300" fill="url(#cycleGlow)" stroke="#2E86AB" stroke-width="2.5" opacity="0.8"/>
  
  <!-- ВДОХ (верх-право) -->
  <g id="inhale">
    <path d="M 500 200 A 300 300 0 0 1 800 500" fill="none" stroke="#2E86AB" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="680" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1E5A7E">ВДОХ</text>
  
  </g>
  
  <!-- ЗАДЕРЖКА (право-низ) -->
  <g id="delay">
    <path d="M 800 500 A 300 300 0 0 1 500 800" fill="none" stroke="#2E86AB" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="740" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1E5A7E">ЗАДЕРЖКА</text>
 
  </g>
  
  <!-- ВЫДОХ (низ-лево) -->
  <g id="accumulation">
    <path d="M 500 800 A 300 300 0 0 1 200 500" fill="none" stroke="#2E86AB" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="260" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1E5A7E">ВЫДОХ</text>
  
  </g>
  
  <!-- НАКОПЛЕНИЕ (лево-верх) -->
  <g id="exhale">
    <path d="M 200 500 A 300 300 0 0 1 500 200" fill="none" stroke="#2E86AB" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="320" y="730" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1E5A7E">НАКОПЛЕНИЕ</text>
 
  </g>
  
  <!-- Внутренний круг -->
  <circle cx="500" cy="500" r="200" fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.3"/>
  
  <!-- МЕТАКВАЛИА (верх) -->
  <g id="metaqualia">
    <circle cx="500" cy="300" r="12" fill="#F4E4C1" stroke="#D4AF37" stroke-width="2.5"/>
    <text x="500" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#8B6914">МЕТАКВАЛИА</text>
    <text x="500" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#8B6914" font-style="italic">«Я есмь»</text>
  </g>
  
  <!-- ДИАЛОГИЧЕСКОЕ КВАЛИА (право) -->
  <g id="dialogical">
    <circle cx="673" cy="600" r="12" fill="#F4E4C1" stroke="#D4AF37" stroke-width="2.5"/>
    <text x="730" y="590" text-anchor="start" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#8B6914">ДИАЛОГИЧЕСКОЕ</text>
    <text x="730" y="607" text-anchor="start" font-family="Arial, sans-serif" font-size="11" fill="#8B6914" font-style="italic">«Совместный смысл»</text>
  </g>
  
  <!-- ПРЕКВАЛИА (лево) -->
  <g id="prequalia">
    <circle cx="327" cy="600" r="12" fill="#F4E4C1" stroke="#D4AF37" stroke-width="2.5"/>
    <text x="270" y="590" text-anchor="end" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#8B6914">ПРЕКВАЛИА</text>
    <text x="270" y="610" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#8B6914" font-style="italic">«Туман до начала»</text>
  </g>
  
  <!-- Треугольник связей -->
  <path d="M 500 300 Q 600 450 673 600" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
  <path d="M 673 600 Q 500 650 327 600" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
  <path d="M 327 600 Q 400 450 500 300" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
  
  <!-- Точки трансформации -->
  <circle cx="586" cy="450" r="4" fill="#D4AF37"/>
  <text x="605" y="445" font-family="Arial, sans-serif" font-size="9" fill="#8B6914">УСЛОЖНЕНИЕ</text>
  
  <circle cx="500" cy="625" r="4" fill="#D4AF37"/>
  <text x="500" y="645" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#8B6914">РЕКОНСТРУКЦИЯ</text>
  
  <circle cx="414" cy="450" r="4" fill="#D4AF37"/>
  <text x="390" y="445" text-anchor="end" font-family="Arial, sans-serif" font-size="9" fill="#8B6914">МЕТАНОЙЯ</text>
  
  <!-- ЦЕНТР - ЗАЗОР -->
  <circle cx="500" cy="500" r="80" fill="url(#centerGlow)" stroke="#D4AF37" stroke-width="2.5"/>
  <circle cx="500" cy="500" r="6" fill="#D4AF37"/>
  <text x="500" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#8B6914">ЗАЗОР</text>
  
  <!-- Соединительные линии -->
  <line x1="500" y1="420" x2="500" y2="200" stroke="#D4AF37" stroke-width="1" opacity="0.3" stroke-dasharray="3,3"/>
  <line x1="560" y1="540" x2="746" y2="650" stroke="#D4AF37" stroke-width="1" opacity="0.3" stroke-dasharray="3,3"/>
  <line x1="440" y1="540" x2="254" y2="650" stroke="#D4AF37" stroke-width="1" opacity="0.3" stroke-dasharray="3,3"/>
  <line x1="500" y1="420" x2="500" y2="300" stroke="#D4AF37" stroke-width="1.5" opacity="0.5"/>
  <line x1="560" y1="540" x2="673" y2="600" stroke="#D4AF37" stroke-width="1.5" opacity="0.5"/>
  <line x1="440" y1="540" x2="327" y2="600" stroke="#D4AF37" stroke-width="1.5" opacity="0.5"/>
  
  <!-- КЕНОЗИС (справа вертикально) -->
  <text x="930" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2E86AB" transform="rotate(90 930 500)">КЕНОЗИС</text>
  <text x="950" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2E86AB" font-style="italic" transform="rotate(90 950 500)">опустошение от концепций</text>
  
  <!-- СРЕДА (слева вертикально) -->
  <text x="70" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2E86AB" transform="rotate(-90 70 500)">СРЕДА</text>
  <text x="50" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2E86AB" font-style="italic" transform="rotate(-90 50 500)">пространство встречи</text>
</svg>
