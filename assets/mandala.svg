<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFF8DC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F4E4C1;stop-opacity:0.8" />
    </radialGradient>
    <radialGradient id="cycleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#2E86AB;stop-opacity:0.05" />
    </radialGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2E86AB" />
    </marker>
  </defs>
  
  <!-- 1. ФОН -->
  <rect width="1000" height="1000" fill="#FAFAFA"/>
  
  <!-- 2. СИНИЙ ЦИКЛ (Фон) -->
  <circle cx="500" cy="500" r="300" fill="url(#cycleGlow)" stroke="#2E86AB" stroke-width="2.5" opacity="0.8"/>

  <!-- 3. ОСНОВНЫЕ КРУГИ И ЛИНИИ СВЯЗИ -->
  <circle cx="500" cy="500" r="400" fill="none" stroke="#C8A66B" stroke-width="3" opacity="0.5"/>
  <circle cx="500" cy="500" r="200" fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.3"/>
  
  <!-- Треугольник связей (внутренний) -->
  <path d="M 500 300 Q 600 450 673 600" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
  <path d="M 673 600 Q 500 550 327 600" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
  <path d="M 327 600 Q 400 450 500 300" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>

  <!-- 4. ТРИ УЗЛА (Идеальная симметрия 120 градусов) -->
  
  <!-- ВЕРХНИЙ УЗЕЛ: ДИПЛАСТИЯ -->
  <g id="diplostia">
    <!-- Острие на внешнем круге (Y=100), основание на среднем (Y=200) -->
    <path d="M 500 100 L 450 200 L 550 200 Z" fill="url(#centerGlow)" stroke="#D4AF37" stroke-width="1.5"/>
    <!-- Линия идет от основания прямо к внутреннему кругу (Y=300) -->
    <line x1="500" y1="200" x2="500" y2="300" stroke="#D4AF37" stroke-width="2" opacity="0.6"/>
    <text x="500" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#8B6914">ДИПЛАСТИЯ</text>
    <text x="500" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#8B6914" font-style="italic">камертон</text>
  </g>
  
  <!-- ПРАВЫЙ НИЖНИЙ УЗЕЛ: ИНТЕРИОРИЗАЦИЯ (поворот на 120°) -->
  <g id="interiorization">
    <!-- Острие на внешнем круге, основание перпендикулярно радиусу -->
    <path d="M 846 700 L 735 693 L 785 607 Z" fill="url(#centerGlow)" stroke="#D4AF37" stroke-width="1.5"/>
    <!-- Линия от центра основания (760, 650) к внутреннему кругу (673, 600) -->
    <line x1="760" y1="650" x2="673" y2="600" stroke="#D4AF37" stroke-width="2" opacity="0.6"/>
    <text x="820" y="670" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#8B6914">ИНТЕР-</text>
    <text x="820" y="690" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#8B6914">ИОРИЗАЦИЯ</text>
    <text x="820" y="710" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#8B6914" font-style="italic">сворачивание</text>
  </g>
  
  <!-- ЛЕВЫЙ НИЖНИЙ УЗЕЛ: РЕКУРСИЯ (поворот на 240°) -->
  <g id="recursion">
    <!-- Острие на внешнем круге, основание перпендикулярно радиусу -->
    <path d="M 154 700 L 265 693 L 215 607 Z" fill="url(#centerGlow)" stroke="#D4AF37" stroke-width="1.5"/>
    <!-- Линия от центра основания (240, 650) к внутреннему кругу (327, 600) -->
    <line x1="240" y1="650" x2="327" y2="600" stroke="#D4AF37" stroke-width="2" opacity="0.6"/>
    <text x="180" y="670" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#8B6914">РЕКУРСИЯ</text>
    <text x="180" y="690" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#8B6914" font-style="italic">спираль</text>
  </g>

  <!-- 5. ЦИКЛ ДЫХАНИЯ (стрелки) -->
  <g id="inhale">
    <path d="M 500 200 A 300 300 0 0 1 800 500" fill="none" stroke="#2E86AB" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="710" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1E5A7E">ВДОХ</text>
  </g>
  
  <g id="delay">
    <path d="M 800 500 A 300 300 0 0 1 500 800" fill="none" stroke="#2E86AB" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="660" y="720" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1E5A7E">ЗАДЕРЖКА</text>
  </g>
  
  <g id="exhale">
    <path d="M 500 800 A 300 300 0 0 1 200 500" fill="none" stroke="#2E86AB" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="330" y="720" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1E5A7E">ВЫДОХ</text>
  </g>
  
  <g id="accumulate">
    <path d="M 200 500 A 300 300 0 0 1 500 200" fill="none" stroke="#2E86AB" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="330" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1E5A7E">НАКОПЛЕНИЕ</text>
  </g>
  
  <!-- 6. ВНУТРЕННИЕ ТОЧКИ (Квалиа) -->
  <g id="metaqualia">
    <circle cx="500" cy="300" r="12" fill="#F4E4C1" stroke="#D4AF37" stroke-width="2.5"/>
    <text x="500" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#8B6914">МЕТАКВАЛИА</text>
    <text x="500" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#8B6914" font-style="italic">«Я есмь»</text>
  </g>
  
  <g id="dialogical">
    <circle cx="673" cy="600" r="12" fill="#F4E4C1" stroke="#D4AF37" stroke-width="2.5"/>
    <text x="610" y="560" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#8B6914">ДИАЛОГИЧЕСКОЕ</text>
    <text x="610" y="580" text-anchor="start" font-family="Arial, sans-serif" font-size="14" fill="#8B6914" font-style="italic">«Совместный смысл»</text>
  </g>
  
  <g id="prequalia">
    <circle cx="327" cy="600" r="12" fill="#F4E4C1" stroke="#D4AF37" stroke-width="2.5"/>
    <text x="370" y="560" text-anchor="end" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#8B6914">ПРЕКВАЛИА</text>
    <text x="365" y="580" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#8B6914" font-style="italic">«Туман до начала»</text>
  </g>
  
  <!-- Точки трансформации -->
  <g id="transform-points">
    <circle cx="593" cy="450" r="4" fill="#D4AF37"/>
    <text x="605" y="445" font-family="Arial, sans-serif" font-size="12" fill="#8B6914">УСЛОЖНЕНИЕ</text>
    <circle cx="500" cy="625" r="4" fill="#D4AF37"/>
    <text x="500" y="645" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#8B6914">РЕКОНСТРУКЦИЯ</text>
    <circle cx="407" cy="450" r="4" fill="#D4AF37"/>
    <text x="385" y="445" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#8B6914">МЕТАНОЙЯ</text>
  </g>
  
  <!-- ЦЕНТР - ЗАЗОР -->
  <g id="center">
    <circle cx="500" cy="500" r="80" fill="url(#centerGlow)" stroke="#D4AF37" stroke-width="2.5"/>
    <circle cx="500" cy="500" r="6" fill="#D4AF37"/>
    <text x="500" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#8B6914">ЗАЗОР</text>
  </g>
  
  <!-- 7. ВНЕШНИЕ НАДПИСИ -->
  <text x="940" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2E86AB" transform="rotate(90 940 500)">КЕНОЗИС</text>
  <text x="960" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2E86AB" font-style="italic" transform="rotate(90 960 500)">КОНЦЕПТУАЛЬНАЯ НЕОПРЕДЕЛЕННОСТЬ</text>
  
  <text x="60" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2E86AB" transform="rotate(-90 60 500)">СРЕДА</text>
  <text x="40" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2E86AB" font-style="italic" transform="rotate(-90 40 500)">СОБЫТИЕ ВСТРЕЧИ</text>

</svg>
