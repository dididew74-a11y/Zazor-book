<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 300" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arrow3d" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7b1fa2"/>
    </marker>
  </defs>
  
  <!-- Фон -->
  <rect width="950" height="300" fill="#fafafa" rx="12"/>
  
  <!-- Заголовок -->
  <text x="475" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Точка входа первого цикла</text>
  
  <!-- Преквалиа 1-го порядка -->
  <rect x="20" y="100" width="180" height="80" rx="8" fill="#fce4ec" stroke="#c2185b" stroke-width="3"/>
  <text x="110" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#880e4f">Преквалиа</text>
  <text x="110" y="148" text-anchor="middle" font-size="11" fill="#880e4f">1-го порядка</text>
  <text x="110" y="168" text-anchor="middle" font-size="10" font-style="italic" fill="#ad1457">до-архитектурный потенциал</text>
  
  <!-- Первый Знак -->
  <rect x="240" y="100" width="160" height="80" rx="8" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
  <text x="320" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#880e4f">Первый Знак</text>
  <text x="320" y="150" text-anchor="middle" font-size="11" font-style="italic" fill="#ad1457">от Другого</text>
  
  <!-- Диалогическое квалиа -->
  <rect x="440" y="100" width="170" height="80" rx="8" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="3"/>
  <text x="525" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a148c">Диалогическое</text>
  <text x="525" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a148c">квалиа</text>
  <text x="525" y="168" text-anchor="middle" font-size="10" font-style="italic" fill="#6a1b9a">первый резонанс</text>
  
  <!-- Резонансный след -->
  <rect x="650" y="100" width="160" height="80" rx="8" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
  <text x="730" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#e65100">Резонансный</text>
  <text x="730" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#e65100">след</text>
  <text x="730" y="168" text-anchor="middle" font-size="10" font-style="italic" fill="#ef6c00">зародыш метаквалиа</text>
  
  <!-- Метаквалиа -->
  <rect x="840" y="110" width="90" height="60" rx="8" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
  <text x="885" y="135" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b5e20">Мета-</text>
  <text x="885" y="152" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b5e20">квалиа</text>
  
  <!-- Стрелки -->
  <line x1="200" y1="140" x2="238" y2="140" stroke="#555" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="400" y1="140" x2="438" y2="140" stroke="#555" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="610" y1="140" x2="648" y2="140" stroke="#555" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="810" y1="140" x2="838" y2="140" stroke="#555" stroke-width="2" marker-end="url(#arrow3)"/>
  
  <!-- Пунктирная стрелка замыкания -->
  <path d="M 885 172 C 885 250, 110 250, 110 182" fill="none" stroke="#7b1fa2" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow3d)"/>
  
  <!-- Подпись -->
  <text x="475" y="260" text-anchor="middle" font-size="11" fill="#7b1fa2">далее: зрелый цикл (метаквалиа → кенозис → преквалиа-2 → …)</text>
</svg>
