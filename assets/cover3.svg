<svg xmlns="http://www.w3.org/2000/svg" 
     width="1200" height="1600" viewBox="0 0 1200 1600"
     role="img" aria-labelledby="cover-title cover-desc">
  <title id="cover-title">Обложка книги «Зазор»</title>
  <desc id="cover-desc">Диалогическая онтология события и антропотехника проводника. Автор — Александр Медведчиков. Почти замкнутый круг с разрывом на фоне цвета слоновой кости.</desc>
  
  <!-- Фон цвета слоновой кости -->
  <rect width="1200" height="1600" fill="#FFFFF0"/>
  
  <!-- Почти замкнутый круг: разрыв — это и есть зазор -->
  <circle cx="600" cy="640" r="300" fill="none" stroke="#1a1a1a" stroke-width="10"
          stroke-linecap="round" stroke-dasharray="1700 190"
          transform="rotate(-60 600 640)"/>
          
  <!-- Название -->
  <text x="600" y="1180" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="150" letter-spacing="30" fill="#111111">ЗАЗОР</text>
        
  <!-- Подзаголовок 1 -->
  <text x="600" y="1270" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="42" fill="#444444">Диалогическая онтология события</text>
        
  <!-- Подзаголовок 2 -->
  <text x="600" y="1330" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="42" fill="#444444">и антропотехника проводника</text>
        
  <!-- Автор -->
  <text x="600" y="1460" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="40" fill="#555555">Александр Медведчиков</text>
</svg>
